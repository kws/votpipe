[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "votpipe"
version = "0.2.0"
description = "Lightweight streaming parser for VOTable files; convert to Parquet, CSV, or ECSV with optional filtering."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["votable", "streaming", "astronomy", "parquet", "csv", "ecsv", "virtual-observatory"]

[project.urls]
Homepage = "https://github.com/kws/votpipe"
Repository = "https://github.com/kws/votpipe"

[project.scripts]
votpipe = "votpipe._cli:cli"

[project.optional-dependencies]
astropy = ["astropy>=6"]
cli = ["click>=8", "tqdm"]
parquet = ["pyarrow>=18"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "coverage[toml]>=7",
  "pre-commit>=4",
  "ruff>=0.8",
  "astropy>=6",
  "pyarrow>=18",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src/votpipe"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover"]

[tool.pytest.ini_options]
addopts = "--cov=votpipe --cov-report=term-missing"
testpaths = ["tests"]
